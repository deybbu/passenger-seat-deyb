<style>
:root{--red:#C62828;--deep:#A61B1B;--acc:#E53935;--soft:#F8F8FA;--line:#ECECF1;--ink:#1d1d22;--mute:#767681;
--disp:"Bebas Neue","Oswald","Arial Narrow",sans-serif;--body:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-snap-type:y proximity}
body{font-family:var(--body);color:var(--ink);background:#fff;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#track{position:relative}
#snaps i{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}
.stage{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
 padding:env(safe-area-inset-top) 16px 0;background:#fff}
header{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 0 8px}
header img{width:52px;height:52px;object-fit:contain}
.table{font-family:var(--disp);font-size:22px;letter-spacing:.04em;background:var(--red);color:#fff;
 padding:4px 16px 3px;border-radius:999px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 16px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wheel-wrap{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.wheel{position:relative;width:min(100cqw,100cqh);aspect-ratio:1}
.wheel::before{content:"";position:absolute;inset:26px;border-radius:50%;border:1.5px dashed #e4b9b9}
.notch{position:absolute;left:50%;top:0;width:0;height:0;transform:translateX(-50%);
 border:7px solid transparent;border-top:10px solid var(--red);z-index:3}
.node{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:#fff;
 border:2px solid #f0c6c6;box-shadow:0 4px 10px rgba(166,27,27,.12);font-family:var(--disp);font-size:19px;
 color:var(--red);display:grid;place-items:center;background-size:cover;background-position:center;will-change:transform}
.node.on{background-color:var(--red);color:#fff;border-color:var(--red);z-index:2}
.plate{position:absolute;inset:23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4f4f7);
 box-shadow:0 14px 30px rgba(0,0,0,.1),inset 0 0 0 10px #fff,inset 0 0 0 11px var(--line);display:grid;place-items:center;text-align:center}
.rim{position:absolute;inset:9%;border-radius:50%;border:5px dotted var(--red);opacity:.85}
.plate b{position:relative;font-family:var(--disp);font-weight:400;font-size:clamp(48px,17cqmin,92px);line-height:.9;color:var(--red)}
.plate small{position:relative;display:block;font-size:12px;color:var(--mute);margin-top:4px;max-width:90px}
.plate.img{background-size:cover;background-position:center}
.info{padding:6px 0 24px;min-height:196px}
.info h2{font-family:var(--disp);font-weight:400;font-size:34px;letter-spacing:.02em;line-height:1}
.info p{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:15px;font-weight:500;margin-top:2px}
.wheel.boodle{width:100cqw;height:min(100cqh,62cqw);aspect-ratio:auto;overflow:hidden}
.wheel.boodle::before,.wheel.boodle .notch{display:none}
.wheel.boodle .plate{inset:4% 2% 34% 2%;border-radius:26px;box-shadow:0 12px 26px rgba(0,0,0,.1),inset 0 0 0 8px #fff,inset 0 0 0 9px var(--line)}
.wheel.boodle .rim{inset:10px;border-radius:18px;border-width:4px}
.wheel.boodle .plate b{font-size:clamp(44px,14cqmin,72px)}
.wheel.boodle .plate small{max-width:none;font-size:13px}
.wheel.boodle .node{width:62px;height:42px;border-radius:12px;font-size:17px}
.add[disabled]{opacity:.45;pointer-events:none}
header{position:relative}
.basket{position:absolute;right:0;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.basket svg{width:23px;height:23px}
.basket.has{background:var(--red);color:#fff;border-color:var(--red)}
.basket span{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.basket span[hidden]{display:none}
.basket.bump{animation:bumpb .35s}
@keyframes bumpb{40%{transform:translateY(-50%) scale(1.18)}}
@media (min-width:900px){
 html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
 body{background:#eeeef3}
 .stage{max-width:1240px;top:12px;height:calc(100svh - 24px);margin-top:12px;border-radius:32px;padding:20px 28px 24px;
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) 360px;grid-template-rows:auto auto minmax(0,1fr);column-gap:28px}
 header{grid-column:1/-1;padding:0 0 8px}
 header img{width:60px;height:60px}
 .pills{grid-column:1/3;flex-wrap:wrap;overflow:visible;padding:8px 0 12px}
 .wheel-wrap{grid-column:1;grid-row:3}
 .info{grid-column:2;grid-row:3;align-self:center;padding:0;min-height:0}
 .info h2{font-size:52px}
 .info p.desc{-webkit-line-clamp:5;font-size:15px}
 .sub{font-size:18px}
 .ing{flex-wrap:wrap;overflow:visible}
 body #bar,body .scrim,body .basket{display:none!important}
 body .sheet,body.open .sheet{left:auto;right:max(28px,calc((100vw - 1240px)/2 + 28px));top:104px;bottom:36px;width:360px;max-height:none;transform:none;
  border-radius:24px;background:var(--soft);border:1px solid var(--line);transition:none}
 .sheet h3 [data-close]{display:none}
 .line{background:#fff}
}
.info p.desc{-webkit-line-clamp:2}
.ing{display:flex;align-items:center;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.ing::-webkit-scrollbar{display:none}
.ing b{flex:none;font-size:12px;margin-right:2px}
.ing span{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;border:1px dashed #cfcfd8;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-style:solid;border-color:var(--ink)}
.buy{display:flex;align-items:center;gap:12px;margin-top:12px}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:30px;height:30px;border-radius:50%;background:#e9e9ee;font-size:18px;line-height:1}
.add{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;
 border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 8px 18px rgba(198,40,40,.3)}
.add:active{background:var(--deep)}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,120px);width:min(528px,calc(100% - 24px));
 display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:999px;
 padding:14px 22px;font-weight:700;z-index:20;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#bar.show{transform:translate(-50%,0)}
#bar.bump{animation:bump .3s}
@keyframes bump{50%{transform:translate(-50%,0) scale(1.04)}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:88svh;overflow:auto;transform:translate(-50%,100%);
 background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));z-index:31;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
body.open .scrim{opacity:1;pointer-events:auto}body.open .sheet{transform:translate(-50%,0)}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:28px;display:flex;justify-content:space-between;align-items:center}
.line{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;border:1px dashed #d9d9e0;border-radius:16px}
.line .code{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--disp);color:var(--red);font-size:17px}
.line div:nth-child(2){flex:1;font-size:14px}.line em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.row{display:flex;justify-content:space-between;margin-top:14px;font-weight:700}
textarea{width:100%;margin-top:14px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px;font:inherit;font-size:14px;resize:none}
.done{text-align:center;padding:18px 0}.done b{display:block;font-family:var(--disp);font-weight:400;font-size:46px;color:var(--red);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="track">
  <div id="snaps"></div>

    <nav class="pills" id="pills" aria-label="Menu categories"></nav>
    <div class="wheel-wrap">
      <div class="wheel" id="wheel">
        <span class="notch"></span>
        <div id="ring"></div>
        <div class="plate" id="plate"><div class="rim" id="rim"></div><div><b id="code"></b><small id="catName"></small></div></div>
      </div>
    </div>
    <section class="info" id="info" aria-live="polite"></section>
  </main>
</div>


<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Your order"></aside>

<script>
/* ---------- Config ---------- */
// Set to e.g. "/api/orders" to POST orders to Laravel. null = demo mode (order stays on the device).
const CONFIG = { orderEndpoint: null };

/* ---------- Menu: [name, description, price | [[option, price],…], note?] ---------- */
const MENU = [
["Appetizers",[["Paris","Salted Fries",65],["Brussels","Special Cheesy Beef Fries",99],["London","Crispy Fish Fillet and Fries",110]]],
["A La Carte",[["Zambales","Sinigang sa Miso",199],["Sampaloc","Sinigang na Hipon",199],["Vigan","Sinigang na Lechon Kawali",195],["Pampanga","Sizzling Pork Sisig",159]]],
["Single Flights",[["Bacolod","Chicken Inasal, Ensalada and Rice",149],["Cebu","Grilled Liempo, Ensalada and Rice",149],["Ilocos","Lechon Kawali, Ensalada and Rice",149],["Roxas","Grilled Stuffed Squid, Ensalada and Rice",155],["Dagupan","Daing na Bangus, Ensalada and Rice",155],["Gensan","Buttered Shrimp, Ensalada and Rice",159]]],
["International",[["Mexico City","Homemade salsa and beef in tomato sauce with onions, torched cheese on top",159]]],
["Boodle Flights",[
 ["Manila","Chicken Inasal, Grilled Liempo, Lechon Kawali, Red Egg, Okra, Eggplant, Ensalada, Rice and a Pitcher of Iced Tea",559,"Good for 2-3"],
 ["Palawan","Daing na Bangus, Grilled Stuffed Squid, Buttered Shrimp, Red Egg, Okra, Eggplant, Ensalada, Rice and a Pitcher of Iced Tea",559,"Good for 2-3"],
 ["Bohol","Daing na Bangus, Buttered Shrimp, Lechon Kawali, Red Egg, Okra, Eggplant, Ensalada, Rice and a Pitcher of Iced Tea",559,"Good for 2-3"],
 ["Davao","Chicken Inasal, Grilled Liempo, Grilled Stuffed Squid, Red Egg, Okra, Eggplant, Ensalada, Rice and a Pitcher of Iced Tea",559,"Good for 2-3"],
 ["Batanes","Chicken Inasal, Grilled Liempo, Grilled Stuffed Squid, Sinigang na Hipon, Red Eggs, Okra, Eggplant, Ensalada, Rice and a Pitcher of Iced Tea",849,"Good for 3-5"],
 ["Caticlan","Daing na Bangus, Buttered Shrimp, Grilled Stuffed Squid, Sizzling Pork Sisig, Red Eggs, Okra, Eggplant, Ensalada, Rice and a Pitcher of Iced Tea",849,"Good for 3-5"],
 ["LuzViMinda","Chicken Inasal, Grilled Liempo, Lechon Kawali, Daing na Bangus, Grilled Stuffed Squid, Buttered Shrimp, 2 Red Eggs, Okra, Eggplant, Ensalada, Rice and 2 Pitchers of Iced Tea",1100,"Good for 5-7"],
 ["Pilipinas","Chicken Inasal, Grilled Liempo, Lechon Kawali, Daing na Bangus, Grilled Stuffed Squid, Buttered Shrimp, Sizzling Pork Sisig, Sinigang sa Miso, Red Eggs, Okra, Eggplant, Ensalada, Rice and 2 Pitchers of Iced Tea",1399,"Good for 5-8"]]],
["Chicken Wings",[["Palestine","Crispy chicken wings in homemade butter cream sauce",179],["Kyoto","Crispy chicken wings in homemade teriyaki sauce",159]]],
["Pasta",[["France","Homemade salsa red sauce with shrimp and squid in special seasoning",145],["Rome","Creamy white sauce with bacon, mushroom and ham",145],["Italy","Olive oil, garlic, red chili flakes, mushroom, bell pepper and shrimp",145]]],
["Byahe na Dine",[["Tagaytay","Bulalo",[["Good for 2-4",350]]],["Batangas","Lomi",[["Good for 3-4",359],["Good for 1",129]]]]],
["Burgers",[["Germany","Quarter pounder patty, three cheese, tomato, lettuce, cucumber and egg",95],["Toronto","Quarter pounder patty, three cheese, mushroom, bacon and egg",99],["California","Quarter pounder patty, three cheese, tomato, lettuce and cucumber",95]]],
["Dessert",[["Belgium","Sizzling Brownies",[["Uncle D's Classic Ice Cream",125],["Uncle D's Special Ice Cream",130]]]]],
["Drinks",[["Iced Tea","",[["Solo",35],["Pitcher",65]]],["Soda in Can","",[["Coca-Cola",50],["Sprite",50],["Royal",50]]],["Passenger Sunrise","Pink Juice",60],["Milo Dinosaur","Iced Milo",90]]],
["Shakes",[["Sorsogon","Avocado Shake",125],["Guimaras","Ripe Mango Shake",125],["Okinawa","Matcha Shake",125],["Baguio City","Strawberry Shake",125],["Pangasinan","Watermelon Shake",125]]],
["Beers",[["Pale Pilsen / Stallion","",[["Solo",55],["Bucket of 5+1",300]]],["Lights / Flavored","",[["Solo",55],["Bucket of 5+1",300]]],["Red Horse","",[["Solo",55],["Bucket of 5+1",300]]]]]
];
/* Optional photos: add a 5th/6th value is not needed — just fill this map with name → image URL */
const PHOTOS = { /* "Cebu": "img/cebu.jpg" */ };

/* ---------- Descriptions & ingredients (edit freely; check allergens with the kitchen) ---------- */
const DETAILS = {
"Paris":["Crisp golden fries tossed in salt. The simple starter to share.",["Potatoes","Salt","Cooking oil"]],
"Brussels":["Fries piled with seasoned beef and a blanket of melted cheese.",["Potatoes","Seasoned beef","Cheese sauce"]],
"London":["Golden fried fish fillet served over a pile of crunchy fries.",["Fish fillet","Breading","Potatoes","Cooking oil"]],
"Zambales":["A sour, savory soup with a miso twist, served hot with fresh vegetables.",["Miso","Tamarind","Fish","Kangkong","Radish","Tomato","Onion","Green chili"]],
"Sampaloc":["Classic tamarind-sour soup with plump shrimp and garden vegetables.",["Shrimp","Tamarind","Kangkong","Radish","Tomato","Onion","Green chili"]],
"Vigan":["Crispy lechon kawali simmered in a tangy tamarind broth.",["Lechon kawali (pork belly)","Tamarind","Kangkong","Radish","Tomato","Onion","Green chili"]],
"Pampanga":["Chopped pork served sizzling hot, tangy, savory and a little spicy.",["Pork","Onion","Chili","Calamansi","Seasoning"]],
"Bacolod":["Smoky grilled chicken inasal with a fresh salad and rice.",["Chicken inasal","Ensalada","Rice","Red egg"]],
"Cebu":["Charcoal-grilled pork belly with a fresh salad and rice.",["Grilled liempo","Ensalada","Rice","Red egg"]],
"Ilocos":["Crackling lechon kawali with a fresh salad and rice.",["Lechon kawali","Ensalada","Rice","Red egg"]],
"Roxas":["Grilled squid stuffed with savory filling, served with salad and rice.",["Stuffed squid","Ensalada","Rice","Red egg"]],
"Dagupan":["Marinated milkfish fried until crisp, served with salad and rice.",["Daing na bangus","Ensalada","Rice","Red egg"]],
"Gensan":["Shrimp cooked in garlic butter, served with salad and rice.",["Buttered shrimp","Ensalada","Rice","Red egg"]],
"Mexico City":["A Mexican-style plate of homemade beef and salsa, finished with torched cheese.",["Homemade salsa","Homemade beef","Tomato sauce","Onions","Torched cheese"]],
"Palestine":["Crispy chicken wings coated in a rich homemade butter cream sauce.",["Chicken wings","Homemade butter cream sauce"]],
"Kyoto":["Crispy chicken wings glazed in sweet-savory homemade teriyaki sauce.",["Chicken wings","Homemade teriyaki sauce"]],
"France":["Pasta in a homemade salsa red sauce with shrimp and squid.",["Pasta","Salsa red sauce","Shrimp","Squid","Special seasoning"]],
"Rome":["Creamy white sauce pasta with bacon, mushroom and ham.",["Pasta","Creamy white sauce","Bacon","Mushroom","Ham","Special seasoning"]],
"Italy":["Garlicky olive oil pasta with a little heat from chili flakes.",["Pasta","Olive oil","Garlic","Red chili flakes","Mushroom","Bell pepper","Shrimp"]],
"Tagaytay":["Slow-cooked beef shank soup, rich and warming, made for sharing.",["Beef shank","Bone marrow","Corn","Pechay","Cabbage","Onion","Peppercorn"]],
"Batangas":["Thick, hearty egg noodle soup in a savory, silky broth.",["Egg noodles","Pork","Egg","Cabbage","Carrots","Garlic"]],
"Germany":["Homemade quarter pounder with three kinds of cheese and fresh vegetables.",["Quarter pounder patty","Torched cheese","Square cheese","Special cheese","Tomato","Lettuce","Cucumber","Egg","Bun"]],
"Toronto":["Homemade quarter pounder with cheese, mushroom, bacon and egg.",["Quarter pounder patty","Three cheese","Mushroom","Bacon","Egg","Bun"]],
"California":["Homemade quarter pounder with three kinds of cheese and a fresh crunch.",["Quarter pounder patty","Torched cheese","Square cheese","Special cheese","Tomato","Lettuce","Cucumber","Bun"]],
"Belgium":["A brownie served sizzling hot, topped with a scoop of ice cream.",["Chocolate brownie","Uncle D's ice cream"]],
"Iced Tea":["Chilled house iced tea. Order it solo or by the pitcher.",["Tea","Sugar","Ice"]],
"Soda in Can":["Ice-cold canned soda. Choose your favorite.",["Coca-Cola","Sprite","Royal"]],
"Passenger Sunrise":["Our pink juice drink, bright and refreshing.",["Pink juice","Ice"]],
"Milo Dinosaur":["Iced Milo topped with extra Milo powder.",["Milo","Milk","Ice","Milo powder"]],
"Sorsogon":["Creamy, smooth avocado shake.",["Avocado","Milk","Sugar","Ice"]],
"Guimaras":["Sweet ripe mango blended into a cold shake.",["Ripe mango","Milk","Sugar","Ice"]],
"Okinawa":["Earthy matcha shake, creamy and lightly sweet.",["Matcha","Milk","Sugar","Ice"]],
"Baguio City":["Fresh strawberry shake, sweet and tangy.",["Strawberry","Milk","Sugar","Ice"]],
"Pangasinan":["Light, juicy watermelon shake.",["Watermelon","Sugar","Ice"]],
"Pale Pilsen / Stallion":["Ice-cold local beer. Order solo or a bucket of 5+1.",["Contains alcohol"]],
"Lights / Flavored":["Ice-cold light or flavored beer. Order solo or a bucket of 5+1.",["Contains alcohol"]],
"Red Horse":["Ice-cold strong beer. Order solo or a bucket of 5+1.",["Contains alcohol"]]
};
const detail = it => MENU[cat][0] === "Boodle Flights"
  ? ["A shared boodle spread. " + it[3] + " people.", it[1].split(/, | and /).map(s => s.trim())]
  : DETAILS[it[0]] || ["", []];

/* ---------- Helpers & state ---------- */
const $ = s => document.querySelector(s);
const peso = n => "₱" + n.toLocaleString("en-PH");
const code = it => it[0].replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
const optsOf = it => Array.isArray(it[2]) ? it[2] : [["", it[2]]];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STEP = 90; // px of page scroll per dish
const DESK = matchMedia("(min-width: 900px)"); // desktop/website layout, otherwise phone layout
let confirmed = null, notesVal = "";

const params = new URLSearchParams(location.search);
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let table = params.get("table") || (location.pathname.match(/table\/(\w+)/) || [])[1] || ls.get("ps_table") || "5";
if (table) ls.set("ps_table", table);
const tableBtn = $("#tableNo");
const showTable = () => tableBtn.textContent = table ? "Table " + table : "Set table";
tableBtn.onclick = () => { if (table) return; const t = prompt("Enter your table number"); if (t) { table = t.trim(); ls.set("ps_table", table); showTable(); } };
showTable();

let cart = [];
try { cart = JSON.parse(ls.get("ps_cart") || "[]"); } catch (e) {}
const saveCart = () => ls.set("ps_cart", JSON.stringify(cart));

let cat = 0, items = [], N = 0, step = 45, cur = 0, tgt = 0, active = -1, opt = 0, qty = 1, raf = 0;

/* ---------- Categories ---------- */
$("#pills").innerHTML = MENU.map((c, i) => `<button class="pill" data-c="${i}">${c[0]}</button>`).join("");
$("#pills").onclick = e => { const b = e.target.closest(".pill"); if (b) build(+b.dataset.c); };

function build(c) {
  cat = c; items = MENU[c][1]; N = items.length; step = Math.min(45, 360 / N);
  $("#track").style.height = `calc(100svh + ${(N - 1) * STEP}px)`;
  $("#snaps").innerHTML = items.map((_, i) => `<i style="top:${i * STEP}px"></i>`).join("");
  $("#ring").innerHTML = items.map((it, i) => `<button class="node" data-i="${i}" aria-label="${it[0]}"${PHOTOS[it[0]] ? ` style="background-image:url(${PHOTOS[it[0]]});color:transparent"` : ""}>${code(it)}</button>`).join("");
  document.querySelectorAll(".pill").forEach((p, i) => { p.classList.toggle("on", i === c); if (i === c) p.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); });
  $("#wheel").classList.toggle("boodle", MENU[c][0] === "Boodle Flights");
  window.scrollTo(0, 0); cur = tgt = 0; active = -1; setActive(0); frame();
}
$("#ring").onclick = e => { const n = e.target.closest(".node"); if (n) window.scrollTo({ top: n.dataset.i * STEP, behavior: reduce ? "auto" : "smooth" }); };

/* ---------- Rotating plate wheel ---------- */
function frame() {
  const wh = $("#wheel"), bd = wh.classList.contains("boodle"), R = wh.clientWidth / 2 - 30;
  cur += (tgt - cur) * (reduce ? 1 : 0.14);
  if (Math.abs(tgt - cur) < 0.002) cur = tgt;
  [...$("#ring").children].forEach((n, i) => {
    const r = (i - cur) * step * Math.PI / 180, k = Math.max(0, 1 - Math.abs(i - cur));
    n.style.transform = bd
      ? `translate(-50%,-50%) translate(${(i - cur) * 72}px,${wh.clientHeight * 0.36}px) scale(${1 + 0.3 * k})`
      : `translate(-50%,-50%) translate(${R * Math.sin(r)}px,${-R * Math.cos(r)}px) scale(${1 + 0.3 * k})`;
    n.classList.toggle("on", i === active);
  });
  $("#rim").style.transform = bd ? "none" : `rotate(${-cur * step}deg)`;
  raf = cur !== tgt ? requestAnimationFrame(frame) : 0;
}
addEventListener("scroll", () => {
  tgt = clamp(scrollY / STEP, 0, N - 1);
  setActive(Math.round(tgt));
  if (!raf) raf = requestAnimationFrame(frame);
}, { passive: true });
addEventListener("resize", () => frame());

/* ---------- Dish details ---------- */
function setActive(i) { if (i === active) return; active = i; opt = 0; qty = 1; renderInfo(); }
function renderInfo() {
  const it = items[active], o = optsOf(it), multi = Array.isArray(it[2]);
  $("#code").textContent = code(it);
  $("#catName").textContent = $("#wheel").classList.contains("boodle") ? it[3] : MENU[cat][0];
  const pl = $("#plate"); const ph = PHOTOS[it[0]];
  pl.classList.toggle("img", !!ph); pl.style.backgroundImage = ph ? `url(${ph})` : "";
  $("#info").innerHTML = `<h2>${it[0]}</h2>
    ${it[1] && it[1].length <= 40 ? `<div class="sub">${it[1]}</div>` : ""}
    ${detail(it)[0] ? `<p class="desc">${detail(it)[0]}</p>` : ""}
    ${detail(it)[1].length ? `<div class="ing"><b>Ingredients</b>${detail(it)[1].map(x => `<span>${x}</span>`).join("")}</div>` : ""}
    ${multi ? `<div class="chips">${o.map((x, j) => `<button class="chip ${j === opt ? "on" : ""}" data-o="${j}">${x[0]}</button>`).join("")}</div>` : ""}
    <div class="buy"><div class="qty"><button data-q="-1" aria-label="Less">–</button><span>${qty}</span><button data-q="1" aria-label="More">+</button></div>
    <button class="add" data-add><span>Add to order</span><span>${peso(o[opt][1] * qty)}</span></button></div>`;
}
$("#info").onclick = e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.o) opt = +t.dataset.o;
  else if (t.dataset.q) qty = Math.max(1, qty + +t.dataset.q);
  else if ("add" in t.dataset) return addToCart();
  renderInfo();
};

/* ---------- Cart ---------- */
function addToCart() {
  const it = items[active], o = optsOf(it)[opt], k = it[0] + "|" + o[0];
  const line = cart.find(l => l.k === k);
  line ? line.qty += qty : cart.push({ k, name: it[0], code: code(it), opt: o[0] || it[1], price: o[1], qty });
  qty = 1; saveCart(); renderInfo(); renderBar();
  $("#basket").classList.remove("bump"); void $("#basket").offsetWidth; $("#basket").classList.add("bump");
}
const count = () => cart.reduce((s, l) => s + l.qty, 0);
const total = () => cart.reduce((s, l) => s + l.qty * l.price, 0);
function renderBar() {
  $("#basket").classList.toggle("has", count() > 0);
  if (DESK.matches) renderSheet();
  $("#barCount").textContent = count(); $("#barCount").hidden = !count();
  $("#basket").title = count() + " in your basket · " + peso(total());
}
function renderSheet(d) {
  if (d) confirmed = d;
  const done = confirmed;
  const s = $("#sheet");
  if (done) { s.innerHTML = `<div class="done"><p>Order sent to the kitchen for ${table ? "table " + table : "your table"}</p><b>${done}</b><p style="color:var(--mute);font-size:14px">Show this reference number to our crew if needed.</p></div><button class="add" data-close style="width:100%;justify-content:center">Back to menu</button>`; return; }
  s.innerHTML = `<h3>Your order <button data-close aria-label="Close" style="font-size:28px">×</button></h3>
  ${cart.length ? cart.map((l, i) => `<div class="line"><div class="code">${l.code}</div><div>${l.name}<em>${l.opt}</em>${peso(l.price)}</div>
    <div class="qty"><button data-l="${i}" data-d="-1">–</button><span>${l.qty}</span><button data-l="${i}" data-d="1">+</button></div></div>`).join("")
    : `<p style="margin-top:16px;color:var(--mute)">Nothing here yet. Spin the plate and pick a dish.</p>`}
  <textarea id="notes" rows="2" placeholder="Special instructions (e.g. no onions, extra rice)">${notesVal}</textarea>
  <div class="row"><span>Total</span><span>${peso(total())}</span></div>
  <button class="add" data-place style="width:100%;margin-top:14px;justify-content:center" ${cart.length ? "" : "disabled"}>Place order</button>`;
}
$("#basket").onclick = () => { renderSheet(); document.body.classList.add("open"); };
$("#scrim").onclick = () => { confirmed = null; document.body.classList.remove("open"); };
$("#sheet").onclick = async e => {
  const t = e.target.closest("button"); if (!t) return;
  if ("close" in t.dataset) { confirmed = null; document.body.classList.remove("open"); if (DESK.matches) renderSheet(); }
  else if (t.dataset.l) { const l = cart[+t.dataset.l]; l.qty += +t.dataset.d; if (l.qty < 1) cart.splice(+t.dataset.l, 1); saveCart(); renderBar(); renderSheet(); }
  else if ("place" in t.dataset) {
    const ref = "PS-" + Date.now().toString(36).toUpperCase().slice(-6);
    const payload = { reference_number: ref, order_type: "dine-in", table_number: table, special_instructions: $("#notes").value, subtotal: total(), total: total(),
      items: cart.map(l => ({ name: l.name, option: l.opt, price: l.price, quantity: l.qty })) };
    try {
      if (CONFIG.orderEndpoint) {
        const csrf = document.querySelector('meta[name="csrf-token"]');
        const r = await fetch(CONFIG.orderEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json", ...(csrf ? { "X-CSRF-TOKEN": csrf.content } : {}) }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error(r.status);
      }
      cart = []; notesVal = ""; saveCart(); renderBar(); renderSheet(ref);
    } catch (err) { alert("We couldn't send your order. Check your connection and try again."); }
  }
};

$("#sheet").addEventListener("input", e => { if (e.target.id === "notes") notesVal = e.target.value; });
function placeSheet() { // desktop: pin the order panel inside the stage's right-hand column
  const s = $("#sheet");
  if (!DESK.matches) { s.style.right = s.style.top = s.style.bottom = ""; return; }
  const r = $(".stage").getBoundingClientRect(), h = $("header").getBoundingClientRect();
  s.style.right = (document.documentElement.clientWidth - r.right + 28) + "px";
  s.style.top = (h.bottom + 8) + "px";
  s.style.bottom = (innerHeight - r.bottom + 24) + "px";
}
addEventListener("resize", placeSheet);
DESK.addEventListener("change", () => { document.body.classList.remove("open"); renderSheet(); placeSheet(); frame(); });

/* ---------- Init + PWA ---------- */
renderBar(); build(0); placeSheet(); if (document.fonts) document.fonts.ready.then(placeSheet);
</script>
</body>
</html>
