<style>
:root{--red:#C62828;--deep:#A61B1B;--acc:#E53935;--soft:#F8F8FA;--line:#ECECF1;--ink:#1d1d22;--mute:#767681;
--disp:"Bebas Neue","Oswald","Arial Narrow",sans-serif;--body:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-snap-type:y proximity}
body{font-family:var(--body);color:var(--ink);background:#fff;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#track{position:relative}
#snaps i{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}
.stage{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
 padding:env(safe-area-inset-top) 16px 0;background:#fff}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0 8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;padding-top:2px}
header img{width:46px;height:46px;object-fit:contain;flex:none}
.table{font-family:var(--disp);font-size:22px;letter-spacing:.04em;background:var(--red);color:#fff;
 padding:4px 13px 3px;border-radius:999px;white-space:nowrap}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 16px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wheel-wrap{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.wheel{position:relative;width:min(100cqw,100cqh);aspect-ratio:1}
.wheel::before{content:"";position:absolute;inset:26px;border-radius:50%;border:1.5px dashed #e4b9b9}
.notch{position:absolute;left:50%;top:0;width:0;height:0;transform:translateX(-50%);
 border:7px solid transparent;border-top:10px solid var(--red);z-index:3}
.node{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:#fff;
 border:2px solid #f0c6c6;box-shadow:0 4px 10px rgba(166,27,27,.12);font-family:var(--disp);font-size:19px;
 color:var(--red);display:grid;place-items:center;background-size:cover;background-position:center;will-change:transform}
.node.on{background-color:var(--red);color:#fff;border-color:var(--red);z-index:2}
.plate{position:absolute;inset:23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4f4f7);
 box-shadow:0 14px 30px rgba(0,0,0,.1),inset 0 0 0 10px #fff,inset 0 0 0 11px var(--line);display:grid;place-items:center;text-align:center}
.rim{position:absolute;inset:9%;border-radius:50%;border:5px dotted var(--red);opacity:.85}
.plate b{position:relative;font-family:var(--disp);font-weight:400;font-size:clamp(48px,17cqmin,92px);line-height:.9;color:var(--red)}
.plate small{position:relative;display:block;font-size:12px;color:var(--mute);margin-top:4px;max-width:90px}
.plate.img{background-size:cover;background-position:center}
.info{padding:6px 0 24px;min-height:226px}
.info h2{font-family:var(--disp);font-weight:400;font-size:34px;letter-spacing:.02em;line-height:1}
.info p{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:15px;font-weight:500;margin-top:2px}
.wheel.boodle{width:100cqw;height:min(100cqh,62cqw);aspect-ratio:auto;overflow:hidden}
.wheel.boodle::before,.wheel.boodle .notch{display:none}
.wheel.boodle .plate{inset:4% 2% 34% 2%;border-radius:26px;box-shadow:0 12px 26px rgba(0,0,0,.1),inset 0 0 0 8px #fff,inset 0 0 0 9px var(--line)}
.wheel.boodle .rim{inset:10px;border-radius:18px;border-width:4px}
.wheel.boodle .plate b{font-size:clamp(44px,14cqmin,72px)}
.wheel.boodle .plate small{max-width:none;font-size:13px}
.wheel.boodle .node{width:62px;height:42px;border-radius:12px;font-size:17px}
.add[disabled]{opacity:.45;pointer-events:none}
@media (min-width:900px){
 html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
 body{background:#eeeef3}
 .stage{max-width:1240px;top:12px;height:calc(100svh - 24px);margin-top:12px;border-radius:32px;padding:20px 28px 24px;
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) 360px;grid-template-rows:auto auto minmax(0,1fr);column-gap:28px}
 header{grid-column:1/-1;padding:0 0 8px;align-items:center}
 header img{width:60px;height:60px}.table{font-size:26px}
 .pills{grid-column:1/3;flex-wrap:wrap;overflow:visible;padding:8px 0 12px}
 .wheel-wrap{grid-column:1;grid-row:3}
 .info{grid-column:2;grid-row:3;align-self:center;padding:0;min-height:0}
 .info h2{font-size:52px}
 .info p.desc{-webkit-line-clamp:5;font-size:15px}
 .sub{font-size:18px}
 .ing{flex-wrap:nowrap!important;overflow-x:auto!important}
 body #bar,body .scrim{display:none!important}
 body .sheet,body.open .sheet{left:auto;right:max(28px,calc((100vw - 1240px)/2 + 28px));top:104px;bottom:36px;width:360px;max-height:none;transform:none;
  border-radius:24px;background:var(--soft);border:1px solid var(--line);transition:none}
 .sheet h3 [data-close]{display:none}
 .line{background:#fff}
}
.info p.desc{-webkit-line-clamp:2}
.desc-toggle{margin-top:7px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:9px 12px;font-size:13px}
.desc-toggle summary{cursor:pointer;font-weight:700;color:var(--red);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.desc-toggle summary::-webkit-details-marker{display:none}
.desc-toggle summary::after{content:"+";font-size:18px;line-height:1}
.desc-toggle[open] summary::after{content:"−"}
.desc-toggle .full-desc{margin-top:9px;color:var(--mute);font-size:13px;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
.ing{display:flex;align-items:center;gap:6px;overflow-x:auto!important;overflow-y:hidden;margin-top:10px;padding:2px 2px 8px;flex-wrap:nowrap!important;scrollbar-width:thin;scrollbar-color:var(--red) var(--soft);-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;max-width:100%;cursor:grab}
.ing:active{cursor:grabbing}
.ing::-webkit-scrollbar{height:5px}
.ing::-webkit-scrollbar-track{background:var(--soft);border-radius:999px}
.ing::-webkit-scrollbar-thumb{background:var(--red);border-radius:999px}
.ing b{flex:none;font-size:12px;margin-right:2px;position:sticky;left:0;background:#fff;padding:5px 4px 5px 0;z-index:1}
.ing .ing-hint{flex:none;font-size:10px;color:var(--red);white-space:nowrap;margin-right:2px}
.ing span:not(.ing-hint){flex:none;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mute);scroll-snap-align:start;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;border:1px dashed #cfcfd8;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-style:solid;border-color:var(--ink)}
.buy{display:flex;align-items:center;gap:12px;margin-top:12px}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:30px;height:30px;border-radius:50%;background:#e9e9ee;font-size:18px;line-height:1}
.add{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;
 border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 8px 18px rgba(198,40,40,.3)}
.add:active{background:var(--deep)}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,120px);width:min(528px,calc(100% - 24px));
 display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:999px;
 padding:14px 22px;font-weight:700;z-index:20;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#bar.show{transform:translate(-50%,0)}
#bar.bump{animation:bump .3s}
@keyframes bump{50%{transform:translate(-50%,0) scale(1.04)}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:88svh;overflow:auto;transform:translate(-50%,100%);
 background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));z-index:31;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
body.open .scrim{opacity:1;pointer-events:auto}body.open .sheet{transform:translate(-50%,0)}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:28px;display:flex;justify-content:space-between;align-items:center}
.line{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;border:1px dashed #d9d9e0;border-radius:16px}
.line .code{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--disp);color:var(--red);font-size:17px}
.line div:nth-child(2){flex:1;font-size:14px}.line em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.row{display:flex;justify-content:space-between;margin-top:14px;font-weight:700}
textarea{width:100%;margin-top:14px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px;font:inherit;font-size:14px;resize:none}
.done{text-align:center;padding:18px 0}.done b{display:block;font-family:var(--disp);font-weight:400;font-size:46px;color:var(--red);margin:6px 0}
.bill{margin-top:20px;padding-top:16px;border-top:1px dashed #d9d9e0}
.bill h4{font-family:var(--disp);font-weight:400;font-size:24px}
.bsum{font-size:14px;color:var(--mute);margin-top:4px}.bsum b{color:var(--ink)}
.mop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mop button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.mop button.on{background:var(--red);border-color:var(--red);color:#fff}
.add.ink{background:var(--ink);box-shadow:none}
.bnote{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.4;text-align:center}
.linkbtn{display:block;margin:14px auto 0;font-size:13px;color:var(--mute);text-decoration:underline}

.acts{display:flex;gap:4px;flex:none}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:3px;width:48px}
.hbtn small{font-size:10px;font-weight:500;color:var(--mute);line-height:1}
.hbtn .ic{position:relative;width:42px;height:42px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.hbtn svg{width:22px;height:22px}
.hbtn.has .ic{background:var(--red);color:#fff;border-color:var(--red)}
.hbtn.ready .ic{background:#1f8a3b;color:#fff;border-color:#1f8a3b;animation:pulse 1.6s infinite}
.hbtn .ic span{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.hbtn .ic span[hidden]{display:none}
.hbtn.bump .ic{animation:bumpb .35s}
@keyframes bumpb{40%{transform:scale(1.18)}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(31,138,59,.18)}}
@media (max-width:359px){header img{width:36px;height:36px}.table{font-size:18px;padding:4px 10px 3px}.hbtn{width:42px}.hbtn .ic{width:38px;height:38px}}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.serve,.nab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}
.serve{background:#fff3f3;border:1px solid #f0c6c6;color:var(--deep)}
.serve svg{width:15px;height:15px}
.nab{background:var(--deep);color:#fff}
.node.off{filter:grayscale(1);opacity:.5;border-style:dashed}
.node.off.on{background-color:#8b8b95;border-color:#8b8b95}
.plate.off b{color:#9a9aa5}
.chip.off{text-decoration:line-through;color:#9a9aa5;pointer-events:none}
.add.off,.add.off[disabled]{background:#e9e9ee;color:#55555f;box-shadow:none;opacity:1;justify-content:center}
.line.off{border-color:#f0b4b4;background:#fff7f7}
.line .nat{color:var(--deep);font-weight:700}
.line .rm{font-size:13px;font-weight:700;color:var(--deep);text-decoration:underline}
.warn{font-size:13px;color:var(--deep);margin-top:10px;text-align:center}
.ksub{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:6px}
.live{width:8px;height:8px;border-radius:50%;background:#1f8a3b;animation:pulse 1.6s infinite}
.oc{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;margin-top:12px}
.oc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc-h b{font-family:var(--disp);font-weight:400;font-size:22px}
.oc-h em{font-style:normal;font-size:12px;color:var(--mute);margin-left:6px}
.st{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.st.received{background:#ececf1;color:#3a3a44}.st.preparing{background:#FFF1C7;color:#7a4b00}
.st.ready{background:#DDF4E4;color:#12602a}.st.served{background:var(--ink);color:#fff}.st.cancelled{background:#fdecec;color:var(--deep)}
.oc ul{list-style:none;padding:0;margin-top:8px;font-size:14px;color:var(--mute)}
.steps{display:flex;list-style:none;padding:0;margin-top:14px}
.steps li{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative;padding-top:20px}
.steps li::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#dcdce3;z-index:1}
.steps li::after{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:#dcdce3}
.steps li:last-child::after{display:none}
.steps li.done::before,.steps li.now::before,.steps li.done::after{background:var(--red)}
.steps li.now{color:var(--ink);font-weight:700}
.steps.preparing li.now::before{animation:pulse 1.4s infinite}
.steps.ready li.done::before,.steps.ready li.now::before,.steps.ready li.done::after,.steps.served li.done::before,.steps.served li.done::after{background:#1f8a3b}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:calc(100% - 24px);text-align:center}
#toast.show{transform:translate(-50%,0)}
#demo{position:fixed;left:8px;bottom:8px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#demo button{border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:3px 3px 0 0;background:var(--soft)}
#demo input{border:1px solid var(--line);border-radius:8px;padding:4px 6px;width:150px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const ST = { received: "Order Received", preparing: "Preparing", ready: "Ready to Serve", served: "Served", cancelled: "Cancelled" };
const normStatus = s => { s = String(s || "").toLowerCase().replace(/[\s_-]+/g, "");
  return /^(preparing|cooking|inprogress|inkitchen)$/.test(s) ? "preparing" : /^(ready|readytoserve)$/.test(s) ? "ready" : /^(served|completed|delivered)$/.test(s) ? "served" : /^(cancel+ed|void|voided)$/.test(s) ? "cancelled" : "received"; };
let ext = {}; try { ext = JSON.parse(ls.get("ps_status") || "{}") || {}; } catch (e) {}
const demoMode = () => !CONFIG.statusEndpoint && !CONFIG.orderEndpoint;
function statusOf(o) {
  if (ext[o.ref]) return ext[o.ref];
  if (demoMode()) { const a = Date.now() - (o.at || 0), d = CONFIG.demoStatusMs; return a < d[0] ? "received" : a < d[1] ? "preparing" : "ready"; }
  return "received";
}
const lastSt = {};
function orderCard(o) {

  return `<div class="oc"><div class="oc-h"><span><b>Order ${o.batch}</b><em>${o.ref}</em></span><span class="st ${st}">${ST[st]}</span></div>

}
let toastT = 0;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 4500); }
function tick() {
  let changed = false;
  session.orders.forEach(o => { const s = statusOf(o);
    if (lastSt[o.ref] !== s) { if (lastSt[o.ref] && s !== "received") toast(`Order ${o.batch}: ${ST[s]}`); lastSt[o.ref] = s; changed = true; } });

}

/* ---------- Rotating plate wheel ---------- */
function frame() {
  const wh = $("#wheel"), bd = wh.classList.contains("boodle"), R = wh.clientWidth / 2 - 30;
  cur += (tgt - cur) * (reduce ? 1 : 0.14);
  if (Math.abs(tgt - cur) < 0.002) cur = tgt;
  [...$("#ring").children].forEach((n, i) => {
    const r = (i - cur) * step * Math.PI / 180, k = Math.max(0, 1 - Math.abs(i - cur));
    n.style.transform = bd
      ? `translate(-50%,-50%) translate(${(i - cur) * 72}px,${wh.clientHeight * 0.36}px) scale(${1 + 0.3 * k})`
      : `translate(-50%,-50%) translate(${R * Math.sin(r)}px,${-R * Math.cos(r)}px) scale(${1 + 0.3 * k})`;
    n.classList.toggle("on", i === active);
  });
  $("#rim").style.transform = bd ? "none" : `rotate(${-cur * step}deg)`;
  raf = cur !== tgt ? requestAnimationFrame(frame) : 0;
}
addEventListener("scroll", () => {
  tgt = clamp(scrollY / STEP, 0, N - 1);
  setActive(Math.round(tgt));
  if (!raf) raf = requestAnimationFrame(frame);
}, { passive: true });

function renderInfo() {
  const it = items[active], o = optsOf(it), multi = Array.isArray(it[2]) || it[0] === "SODA IN CAN", ok = avail(it);
  if (ok && !optOk(it, o[opt])) opt = o.findIndex(x => optOk(it, x));
  $("#code").textContent = code(it);
  $("#catName").textContent = $("#wheel").classList.contains("boodle") ? it[3] : MENU[cat][0];
  const pl = $("#plate"); const ph = PHOTOS[it[0]];
  pl.classList.toggle("img", !!ph); pl.style.backgroundImage = ph ? `url(${ph})` : ""; pl.classList.toggle("off", !ok);
  const sv = servesOf(it, o[opt], opt);
  $("#info").innerHTML = `<h2>${it[0]}</h2>
    
    ${sv || !ok ? `<div class="meta">${sv ? `<span class="serve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0"/><circle cx="17" cy="9" r="2.500"/><path d="M17 14a5 5 0 0 1 4.500 5"/></svg>${sv}</span>` : ""}${ok ? "" : `<span class="nab">Not Available</span>`}</div>` : ""}
    ${detail(it)[0] ? `<p class="desc">${detail(it)[0]}</p><details class="desc-toggle"><summary>View full description</summary><p class="full-desc">${detail(it)[0]}</p></details>` : ""}
    ${detail(it)[1].length ? `<div class="ing" aria-label="Ingredients. Scroll horizontally to view all ingredients"><b>Ingredients</b><span class="ing-hint">Swipe or scroll →</span>${detail(it)[1].map(x => `<span>${x}</span>`).join("")}</div>` : ""}
    ${multi ? `<div class="chips"><b>${it[0] === "SODA IN CAN" ? "Choose your soda" : "Options"}</b>${o.map((x, j) => `<button class="chip ${j === opt ? "on" : ""} ${optOk(it, x) ? "" : "off"}" data-o="${j}">${x[0]}${optOk(it, x) ? "" : " · Not Available"}</button>`).join("")}</div>` : ""}
    ${ok && o[opt][1] != null ? `<div class="buy"><div class="qty"><button data-q="-1" aria-label="Less">–</button><span>${qty}</span><button data-q="1" aria-label="More">+</button></div>
    <button class="add" data-add><span>Add to order</span><span>${o[opt][1] == null ? "Price not provided" : peso(o[opt][1] * qty)}</span></button></div>`
    : `<div class="buy"><button class="add off" disabled>${ok && o[opt][1] == null ? "Price not provided" : "Not Available"}</button></div>`}`;
}
$("#info").onclick = e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.o) opt = +t.dataset.o;
  else if (t.dataset.q) qty = Math.max(1, qty + +t.dataset.q);
  else if ("add" in t.dataset) return addToCart();
  renderInfo();
};

/* ---------- Cart ---------- */
function addToCart() {
  const it = items[active], o = optsOf(it)[opt], k = it[0] + "|" + o[0];
  const line = cart.find(l => l.k === k);
  if (!avail(it) || !optOk(it, o)) return;
  line ? line.qty += qty : cart.push({ k, name: it[0], code: code(it), opt: o[0] || it[1], price: o[1], qty, serves: servesOf(it, o, opt), ing: ingsOf(it), oi: OPT_AS_ING.has(it[0]) ? o[0] : null });
  qty = 1; saveCart(); renderInfo(); renderBar();
  $("#basket").classList.remove("bump"); void $("#basket").offsetWidth; $("#basket").classList.add("bump");
}
const count = () => cart.reduce((s, l) => s + l.qty, 0);
const total = () => cart.reduce((s, l) => s + l.qty * l.price, 0);
function renderBar() {
  $("#basket").classList.toggle("has", count() > 0);
  $("#billbtn").classList.toggle("has", !!session.bill);
  if (DESK.matches) renderSheet();
  $("#barCount").textContent = count(); $("#barCount").hidden = !count();
  $("#basket").title = count() + " in your basket · " + peso(total());
}
function renderSheet(d) {
  if (d) confirmed = d;
  const done = confirmed;
  const s = $("#sheet");
  if (view === "kitchen") {
    s.innerHTML = `<h3>Live Kitchen <button data-close aria-label="Close" style="font-size:28px">×</button></h3>
    <p class="ksub"><span class="live"></span>Table ${table} · updates automatically</p>
    ${session.orders.length ? [...session.orders].reverse().map(orderCard).join("") : `<p style="margin-top:16px;color:var(--mute)">No orders yet. Place an order and you can follow it here.</p>`}`;
    return;
  }
  if (view === "bill" && !session.bill) {
    s.innerHTML = `<h3>Billing <button data-close aria-label="Close" style="font-size:28px">×</button></h3>
    ${session.orders.length ? `<p class="ksub">Review all confirmed orders for Table ${table} before requesting payment.</p>
      ${session.orders.map(o => `<div class="line"><div class="code">#${o.batch}</div><div>Order ${o.batch}<em>${o.items.map(i => i.quantity + "× " + i.name + (i.option ? " · " + i.option : "")).join(", ")}</em></div><div>${peso(o.total)}</div></div>`).join("")}
      <div class="row" style="margin-top:16px"><b>Total to pay</b><b>${peso(orderedTotal())}</b></div>
      <div class="bill" id="billsec"><h4>Choose payment method</h4>
        <div class="mop" role="radiogroup" aria-label="How will you pay?">${["Cash", "GCash", "Card"].map(m => `<button role="radio" aria-checked="${mop === m}" class="${mop === m ? "on" : ""}" data-mop="${m}">${m}</button>`).join("")}</div>
        <button class="add ink" data-bill style="width:100%;margin-top:12px;justify-content:center" ${mop ? "" : "disabled"}>Request bill for all confirmed orders</button>
        <p class="bnote">Your selected payment method is ${mop || "not selected yet"}. The cashier will finalize the bill and apply any eligible Senior/PWD discount.</p></div>`
      : `<p style="margin-top:16px;color:var(--mute)">No confirmed orders yet. Add dishes to your Cart and select “Place order” first. Confirmed orders will appear here when you are ready to pay.</p>`}`;
    return;
  }
  if (session.bill) {
    s.innerHTML = `<h3>Bill requested <button data-close aria-label="Close" style="font-size:28px">×</button></h3>
    <div class="done"><p>Table ${table}</p><b>${peso(session.bill.total)}</b><p>Paying by <b>${session.bill.method}</b></p><p style="color:var(--mute);font-size:14px">Our crew is on the way with your bill. Reference ${session.bill.ref}</p></div>
    ${session.orders.map(o => `<div class="line"><div class="code">#${o.batch}</div><div>Order ${o.batch}<em>${o.items.map(i => i.quantity + "× " + i.name).join(", ")}</em></div><div>${peso(o.total)}</div></div>`).join("")}
    <button class="add ink" data-cancelbill style="width:100%;margin-top:14px;justify-content:center">Not yet, I'd like to order more</button>
    <button class="linkbtn" data-reset>New guests? Start a new table session</button>`;
    return;
  }
  if (done) { s.innerHTML = `<div class="done"><p>Order sent to the kitchen for ${table ? "table " + table : "your table"}</p><b>${done}</b><p style="color:var(--mute);font-size:14px">Show this reference number to our crew if needed.</p></div>${(o => o ? orderCard(o) : "")(session.orders.find(x => x.ref === done))}<button class="add" style="margin-top:14px;width:100%;justify-content:center" data-close>Back to menu</button>`; return; }
  s.innerHTML = `<h3>Your order <button data-close aria-label="Close" style="font-size:28px">×</button></h3>
  ${cart.length ? cart.map((l, i) => lineOk(l) ? `<div class="line"><div class="code">${l.code}</div><div>${l.name}<em>${l.opt}${l.serves ? " · " + l.serves : ""}</em>${peso(l.price)}</div>
    <div class="qty"><button data-l="${i}" data-d="-1">–</button><span>${l.qty}</span><button data-l="${i}" data-d="1">+</button></div></div>`
    : `<div class="line off"><div class="code">${l.code}</div><div>${l.name}<em>${l.opt}</em><span class="nat">Not Available</span></div><button class="rm" data-l="${i}" data-d="-99">Remove</button></div>`).join("")
    : `<p style="margin-top:16px;color:var(--mute)">Nothing here yet. Spin the plate and pick a dish.</p>`}
  <textarea id="notes" rows="2" placeholder="Special instructions (e.g. no onions, extra rice)">${notesVal}</textarea>
  <div class="row"><span>Total</span><span>${peso(total())}</span></div>
  <button class="add" data-place style="width:100%;margin-top:14px;justify-content:center" ${cart.length && cart.every(lineOk) ? "" : "disabled"}>Place order</button>${cart.every(lineOk) ? "" : `<p class="warn">Some items just became unavailable. Remove them to place your order.</p>`}`;
}
$("#billbtn").onclick = () => {
  if (document.body.classList.contains("open") && view === "bill") { confirmed = null; document.body.classList.remove("open"); return; }
  if (!session.orders.length && !session.bill) { alert("Add dishes to your Cart and place the order first. Billing is for all confirmed orders."); return; }
  confirmed = null; view = "bill"; renderSheet(); document.body.classList.add("open");
  setTimeout(() => { const b = $("#billsec"); if (b) b.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); }, 60);
};
$("#basket").onclick = () => { if (document.body.classList.contains("open") && view === "cart") { confirmed = null; document.body.classList.remove("open"); return; } view = "cart"; confirmed = null; renderSheet(); document.body.classList.add("open"); };
$("#kitchenbtn").onclick = () => { if (document.body.classList.contains("open") && view === "kitchen") { confirmed = null; document.body.classList.remove("open"); return; } view = "kitchen"; confirmed = null; renderSheet(); document.body.classList.add("open"); };
$("#scrim").onclick = () => { confirmed = null; document.body.classList.remove("open"); };
$("#sheet").onclick = async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.mop) { mop = t.dataset.mop; renderSheet(); const b = $("#billsec"); if (b) b.scrollIntoView({ block: "nearest" }); }
  else if ("bill" in t.dataset) {
    if (!mop || !session.orders.length) return;
    const ref = "BR-" + Date.now().toString(36).toUpperCase().slice(-6), tot = orderedTotal();
    const payload = { type: "bill_request", reference_number: ref, table_number: table, payment_method: mop, total: tot, requested_at: new Date().toISOString(),
      orders: session.orders.map(o => ({ reference_number: o.ref, batch_number: o.batch, items: o.items })) };
    try {
      if (CONFIG.billEndpoint) await post(CONFIG.billEndpoint, payload);
      session.bill = { ref, method: mop, total: tot }; saveSession(); renderBar(); renderSheet();
    } catch (err) { alert("We couldn't send your request. Check your connection and try again."); }
  }
  else if ("cancelbill" in t.dataset) {
    if (CONFIG.billEndpoint) post(CONFIG.billEndpoint, { type: "bill_request_cancel", reference_number: session.bill.ref, table_number: table }).catch(() => {});
    session.bill = null; saveSession(); renderBar(); renderSheet();
  }
  else if ("reset" in t.dataset) {
    if (confirm("Start a new table session? The current orders will be cleared from this phone.")) { session = { table, orders: [], bill: null }; mop = null; saveSession(); renderBar(); renderSheet(); }
  }
  else if ("close" in t.dataset) { confirmed = null; view = "cart"; document.body.classList.remove("open"); if (DESK.matches) renderSheet(); }
  else if (t.dataset.l) { const l = cart[+t.dataset.l]; l.qty += +t.dataset.d; if (l.qty < 1 || +t.dataset.d < -1) cart.splice(+t.dataset.l, 1); saveCart(); renderBar(); renderSheet(); }
  else if ("place" in t.dataset) {
    if (!cart.length || !cart.every(lineOk)) return renderSheet();
    const ref = "PS-" + Date.now().toString(36).toUpperCase().slice(-6);
    const payload = { reference_number: ref, batch_number: session.orders.length + 1, order_type: "dine-in", table_number: table, special_instructions: $("#notes").value, subtotal: total(), total: total(),
      items: cart.map(l => ({ name: l.name, option: l.opt, price: l.price, quantity: l.qty })) };
    try {
      if (CONFIG.orderEndpoint) {
        const csrf = document.querySelector('meta[name="csrf-token"]');
        const r = await fetch(CONFIG.orderEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json", ...(csrf ? { "X-CSRF-TOKEN": csrf.content } : {}) }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error(r.status);
      }
      session.orders.push({ ref, batch: payload.batch_number, items: payload.items, total: payload.total, at: Date.now() }); saveSession();
      cart = []; notesVal = ""; saveCart(); view = "cart"; renderBar(); renderSheet(ref); tick();
    } catch (err) { alert("We couldn't send your order. Check your connection and try again."); }
  }
};

$("#sheet").addEventListener("input", e => { if (e.target.id === "notes") notesVal = e.target.value; });
function placeSheet() { // desktop: pin the order panel inside the stage's right-hand column
  const s = $("#sheet");
  if (!DESK.matches) { s.style.right = s.style.top = s.style.bottom = ""; return; }
  const r = $(".stage").getBoundingClientRect(), h = $("header").getBoundingClientRect();
  s.style.right = (document.documentElement.clientWidth - r.right + 28) + "px";
  s.style.top = (h.bottom + 8) + "px";
  s.style.bottom = (innerHeight - r.bottom + 24) + "px";
}
addEventListener("resize", placeSheet);
DESK.addEventListener("change", () => { document.body.classList.remove("open"); renderSheet(); placeSheet(); frame(); });

/* ---------- Init + PWA ---------- */
loadStock(); renderBar(); build(0); placeSheet();
tick(); setInterval(tick, 3000);
if (CONFIG.stockEndpoint || CONFIG.statusEndpoint) { pollRemote(); setInterval(pollRemote, 10000); }
if (params.has("demo")) { // ?demo=1 -> test controls (remove in production)
  const all = [...new Set(Object.values(DETAILS).flatMap(d => d[1]))].sort(), d = document.createElement("details");
  d.id = "demo"; d.innerHTML = `<summary>Demo controls</summary><input id="dIng" list="dL" placeholder="Ingredient"><datalist id="dL">${all.map(x => `<option value="${x}">`).join("")}</datalist><button id="dT">Toggle out of stock</button><div id="dO"></div>
    <div>Latest order: <button data-s="preparing">Preparing</button><button data-s="ready">Ready</button><button data-s="served">Served</button><button data-s="">Auto</button></div>`;
  document.body.appendChild(d);
  const list = () => { try { return (JSON.parse(ls.get("ps_stock") || "{}").out) || []; } catch (e) { return []; } }, show = () => $("#dO").textContent = "Out: " + (list().join(", ") || "none");
  $("#dT").onclick = () => { const v = $("#dIng").value.trim(); if (!v) return; const l = list(), i = l.findIndex(x => norm(x) === norm(v)); i < 0 ? l.push(v) : l.splice(i, 1); PS.setOutOfStock(l); show(); };
  d.onclick = e => { const b = e.target.closest("[data-s]"), o = session.orders[session.orders.length - 1]; if (b && o) PS.setStatus(o.ref, b.dataset.s); }; show();
} if (document.fonts) document.fonts.ready.then(placeSheet);
</script>
</body>
</html>
