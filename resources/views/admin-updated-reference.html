<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passenger Seat Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C62828;--rb:#C62828;--rg:linear-gradient(180deg,#e8453f,#a81f1f);--outer:#f6ecec;--glow:rgba(198,40,40,.22);--shell:#f7eded;--sol:#fff;--gray:#f3e3e3;--cart:#fff;--bd:#ecd6d6;--tx:#2a1414;--tx2:#7a5a5a;--ok:#15803D;--warn:#B45309;--err:#C62828;--tint:rgba(198,40,40,.1);--gl:rgba(247,237,237,.85);--panel:linear-gradient(180deg,#d32f2f,#a61b1b);--nt:rgba(255,255,255,.88);--ng:rgba(255,255,255,.68);--nh:rgba(255,255,255,.14);--nonbg:#fff;--nonc:#b71c1c;--nb:#fff;--nbc:#b71c1c;--dot:transparent;--sh:0 8px 28px rgba(120,20,20,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff6b64;--rb:#d63a35;--outer:#0f0f0f;--glow:rgba(190,45,40,.5);--shell:#1c1c1c;--sol:#292929;--gray:#353535;--cart:#454545;--bd:#3b3b3b;--tx:#f5f5f5;--tx2:#c0c0c0;--ok:#4cc46a;--warn:#f2a93b;--err:#ff6b64;--tint:rgba(255,107,100,.16);--gl:rgba(28,28,28,.85);--panel:#383838;--nt:#f0f0f0;--ng:#c7c7c7;--nh:rgba(255,255,255,.06);--nonbg:transparent;--nonc:#ff6b64;--nb:#d63a35;--nbc:#fff;--dot:#ff6b64;--sh:0 8px 28px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--red:#ff6b64;--rb:#d63a35;--outer:#0f0f0f;--glow:rgba(190,45,40,.5);--shell:#1c1c1c;--sol:#292929;--gray:#353535;--cart:#454545;--bd:#3b3b3b;--tx:#f5f5f5;--tx2:#c0c0c0;--ok:#4cc46a;--warn:#f2a93b;--err:#ff6b64;--tint:rgba(255,107,100,.16);--gl:rgba(28,28,28,.85);--panel:#383838;--nt:#f0f0f0;--ng:#c7c7c7;--nh:rgba(255,255,255,.06);--nonbg:transparent;--nonc:#ff6b64;--nb:#d63a35;--nbc:#fff;--dot:#ff6b64;--sh:0 8px 28px rgba(0,0,0,.35);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}body{font:14px/1.5 Poppins,"Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 600px at 100% 100%,var(--glow),transparent 65%),var(--outer);background-attachment:fixed;color:var(--tx);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--gl);z-index:40}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:10px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);margin:0;border-radius:0;background:var(--shell);overflow:clip;min-height:100vh}
aside{padding:26px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;align-self:start;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:12px;padding:0 24px 18px;font-weight:700;font-size:16px;line-height:1.2}.brand small{display:block;color:var(--tx2);font-weight:400;font-size:12px}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--rg);color:#fff;font-weight:700;box-shadow:0 8px 18px rgba(198,40,40,.4)}
#nav{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border-radius:0 44px 44px 0;margin-right:16px;padding:14px 0 18px}
.grp{font-size:11px;font-weight:600;color:var(--ng);margin:14px 24px 4px}
.nav{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% - 20px);margin:0 10px;min-height:42px;padding:0 14px;border:0;background:none;border-radius:99px;text-align:left;color:var(--nt);font-size:13px}
.nav svg,.round svg,.search svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--nh)}.nav.on{background:var(--nonbg);color:var(--nonc);font-weight:600}.nav.on::before{content:"";position:absolute;left:3px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--dot)}
.nav i{margin-left:auto;font-style:normal;background:var(--nb);color:var(--nbc);border-radius:99px;font-size:11px;font-weight:600;padding:0 8px}
main{min-width:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:20px 28px 12px;background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header h1{margin:0;font-size:22px;line-height:1.2;font-weight:600}header small{color:var(--tx2)}.sp{flex:1}
.search{display:flex;align-items:center;flex:1;max-width:360px;min-width:180px;border:1px solid var(--bd);border-radius:99px;background:var(--sol);padding:3px 3px 3px 16px}.search:focus-within{border-color:var(--red)}
.search input{flex:1;min-width:0;border:0;background:none;min-height:34px;padding:0;outline:none}.search button{width:36px;height:36px;border-radius:50%;border:0;background:var(--gray);display:grid;place-items:center}.search svg{width:17px;height:17px}
.round{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--sol);display:grid;place-items:center}.round .b{position:absolute;top:-5px;right:-5px;padding:0 6px;font-size:11px}
#view{padding:8px 28px 30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--bd);background:var(--sol);font-weight:500;font-size:13px}
.btn:hover{border-color:var(--red)}.btn.p{background:var(--rg);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(198,40,40,.35)}.btn.sm{min-height:32px;padding:0 12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--sol);border:1px solid var(--bd);border-radius:26px;padding:20px;box-shadow:var(--sh)}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{display:grid;gap:16px;grid-template-columns:2fr 1fr}.mt{margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat b{display:block;font-size:26px;line-height:1.2;font-weight:600}.stat small,.mu{color:var(--tx2)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--shell);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;min-height:40px;max-width:100%;accent-color:var(--rb)}
label{display:grid;gap:4px;font-size:12px;color:var(--tx2);font-weight:600}a{color:var(--red)}
.tabs{display:flex;gap:4px;border:1px solid var(--bd);padding:4px;border-radius:99px;flex-wrap:wrap}.tabs button{border:0;background:none;border-radius:99px;min-height:32px;padding:0 16px;color:var(--tx2);font-size:13px}.tabs .on{background:var(--rg);color:#fff;font-weight:600;box-shadow:0 4px 10px rgba(198,40,40,.35)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:540px}th{text-align:left;color:var(--tx2);font-size:12px;font-weight:500;padding:10px 12px;background:var(--gray)}th:first-child{border-radius:99px 0 0 99px;padding-left:18px}th:last-child{border-radius:0 99px 99px 0}
td{padding:12px;border-bottom:1px solid var(--bd)}td:first-child{padding-left:18px}tbody tr:last-child td{border-bottom:0}tr.sel td{background:var(--tint)}
.b{display:inline-block;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:600;color:#fff;background:var(--tx2)}.b.ok{background:#1e8a36}.b.wn{background:#f0a02c;color:#2b1a00}.b.er{background:#c62828}.b.in{background:#2f5fd0}.b.gr{background:var(--gray);color:var(--tx2);box-shadow:inset 0 0 0 1px var(--bd)}
.ok{color:var(--ok)}.wn{color:var(--warn)}.er{color:var(--err)}.in{color:#5b8cff}.gr{color:var(--tx2)}
.msg{padding:9px 14px;border-radius:14px;font-weight:600;margin:10px 0;background:var(--gray)}.msg.ok{background:rgba(21,128,61,.14);color:var(--ok)}.msg.er{background:rgba(220,38,38,.14);color:var(--err)}.msg.wn{background:rgba(217,119,6,.16);color:var(--warn)}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.item{text-align:center;border:1px solid var(--bd);background:var(--shell);border-radius:26px;padding:0 0 4px;overflow:hidden}.item:hover:not(:disabled){border-color:var(--red)}.item:disabled{opacity:.5}
.item .im{width:72px;height:72px;margin:14px auto 0;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:700;background:linear-gradient(145deg,#ef5350,#9e1b1b);box-shadow:0 10px 18px rgba(198,40,40,.35)}.item div.t{padding:10px 12px}.item b{display:block}
.hero{border-radius:28px;padding:22px 24px;background:linear-gradient(120deg,var(--tint),transparent 70%),var(--sol);border:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}.hero h2{margin:0;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px}.bars div{flex:1;background:var(--red);border-radius:6px 6px 0 0;min-height:2px}
.hb{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin:6px 0}.hb i{display:block;height:14px;background:var(--rg);border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal button{min-height:52px;border:1px solid var(--bd);border-radius:12px;background:var(--shell);font-size:12px;text-align:left;padding:4px 6px}.cal .h{border:0;background:none;min-height:0;font-weight:600;color:var(--tx2)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:60}.md .card{max-width:420px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:10px}
.fmt{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:10px;color:var(--tx);background:var(--shell);flex:1}.fmt:has(input:checked){background:rgba(217,162,27,.18);border-color:#D9A21B;color:var(--tx)}.restore{color:#15803D;border-color:#15803D;background:transparent}.restore:hover{background:rgba(21,128,61,.12)}.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--shell);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:70}.toast.on{opacity:1}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}.cart{position:sticky;top:96px;background:var(--cart)}textarea{width:100%}.hide{display:none!important}#menu{display:none}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
@media(max-width:960px){.pos{grid-template-columns:1fr}.cart{position:static}}
@media(max-width:860px){.shell{display:block;margin:0;border-radius:0;min-height:100vh}aside{position:fixed;inset:0 auto 0 0;width:280px;height:100%;background:var(--shell);transform:translateX(-100%);z-index:50}body.open aside{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}#menu{display:inline-flex}header{flex-wrap:wrap;padding:14px 14px 8px}.search{order:9;flex-basis:100%;max-width:none}#view{padding:6px 14px 24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Sidebar redesign: icon rail on a rounded panel, labels on the dark side */
:root{--sbg:#f7eded;--spn:var(--panel);--sit:#fff;--slb:#7a5a5a;--sai:#fff;--sbtn:#b71c1c;--sbtc:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sbg:#242424;--spn:#575757;--sit:#e8e8e8;--slb:#8d8d8d;--sai:#ff6b64;--sbtn:#7d2a2d;--sbtc:#f3d9d9}}
:root[data-theme="dark"]{--sbg:#242424;--spn:#575757;--sit:#e8e8e8;--slb:#8d8d8d;--sai:#ff6b64;--sbtn:#7d2a2d;--sbtc:#f3d9d9}
aside{background:var(--sbg);padding:22px 0 20px}
aside::before{content:"";position:absolute;left:0;top:128px;bottom:84px;width:58px;border-radius:0 32px 32px 0;background:var(--spn);pointer-events:none}
.brand{position:relative;padding:0 0 22px 14px}
.logo{display:block;width:64px;height:auto;padding:5px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);object-fit:contain}
#nav{position:relative;background:none;border-radius:0;margin:0;padding:10px 0 10px;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
.grp{margin:16px 12px 2px 78px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--slb);opacity:.75}
.nav{width:100%;margin:0;padding:0;gap:0;min-height:44px;border-radius:0;color:var(--slb);font-size:13px;font-weight:500}
.nav svg{margin:0 19px;color:var(--sit)}
.nav span{flex:1;min-width:0;margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav:hover{background:none;color:var(--tx)}.nav:hover svg{opacity:.8}
.nav.on{background:none;color:var(--red);font-weight:600}.nav.on svg{color:var(--sai);stroke-width:2.3}
.nav.on::before{left:60px;background:var(--red)}
.nav i{margin:0 16px 0 8px}
.nav:focus-visible{outline-offset:-3px}
.sbf{position:relative;display:flex;gap:14px;padding:14px 0 0 16px}
.sbf button{width:40px;height:40px;border-radius:50%;border:0;background:var(--sbtn);color:var(--sbtc);display:grid;place-items:center}
.sbf button:hover{filter:brightness(1.15)}
.sbf svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


/* Remove decorative shadows across the interface while keeping focus and scanner overlays visible. */
*:not(.admin-scanner-corners) { box-shadow: none !important; text-shadow: none !important; }
*:focus-visible { outline: 2px solid var(--red, currentColor) !important; outline-offset: 2px !important; }
